<!DOCTYPE html>
<html lang="en">

<head>
	<title>MiniTrade - Small Trading Platform</title>

	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="description" content="MiniTrade - Bootstrap 5 Admin Dashboard Template For Developers">
	<meta name="author" content="Xiaoying Riley at 3rd Wave Media">
	<link rel="shortcut icon" href="favicon.ico">

	<!-- FontAwesome JS-->
	<script defer src="assets/plugins/fontawesome/js/all.min.js"></script>

	<!-- App CSS -->
	<link id="theme-style" rel="stylesheet" href="assets/css/portal.css">

</head>

<body class="app app-login p-0">
	<div class="row g-0 app-auth-wrapper">
		<div class="col-12 col-md-7 col-lg-6 auth-main-col text-center p-5">
			<div class="d-flex flex-column align-content-end">
				<div class="app-auth-body mx-auto">
					<div class="app-auth-branding mb-4"><a class="app-logo" href="index.html"><img
								class="logo-icon me-2" src="assets/images/app-logo.svg" alt="logo"></a></div>
					<h2 class="auth-heading text-center mb-5">Log in to MiniTrade</h2>
					<div class="auth-form-container text-start">
						<form class="auth-form login-form">
							<div class="email mb-3">
								<label class="sr-only" for="signin-email">Email</label>
								<input id="signin-email" name="signin-email" type="email"
									class="form-control signin-email" placeholder="Email address" required="required">
							</div>
							<div class="password mb-3">
								<label class="sr-only" for="signin-password">Password</label>
								<div class="input-group">
									<input id="signin-password" name="signin-password" type="password"
										class="form-control signin-password" placeholder="Password" required="required">
									<button id="toggle-password" type="button" class="btn btn-outline-secondary">
										<i id="password-icon" class="fas fa-eye"></i>
									</button>
								</div>
								<div class="extra mt-3 row justify-content-between">
									<div class="col-6">
										<div class="form-check">
											<input class="form-check-input" type="checkbox" value=""
												id="RememberPassword">
											<label class="form-check-label" for="RememberPassword">
												Remember me
											</label>
										</div>
									</div>
									<div class="col-6">
										<div class="forgot-password text-end">
											<a href="reset-password.html">Forgot password?</a>
										</div>
									</div>
								</div>
							</div>
							<div class="text-center">
								<button id="loginButton" type="button"
									class="btn app-btn-primary w-100 theme-btn mx-auto">Log
									In</button>
							</div>
						</form>

						<div class="auth-option text-center pt-5">No Account? Sign up <a class="text-link"
								href="signup.html">here</a>.</div>
					</div>
				</div>

				<footer class="app-auth-footer">
					<div class="container text-center py-3">
						<small class="copyright">Designed with <span class="sr-only">love</span><i class="fas fa-heart"
								style="color: #fb866a;"></i> by <a class="app-link"
								href="http://themes.3rdwavemedia.com" target="_blank">MiniTrade</a> for
							developers</small>
					</div>
				</footer>
			</div>
		</div>
		<div class="col-12 col-md-5 col-lg-6 h-100 auth-background-col">
			<div class="auth-background-holder">
			</div>
			<div class="auth-background-mask"></div>
			<div class="auth-background-overlay p-3 p-lg-5">
				<div class="d-flex flex-column align-content-end h-100">
					<div class="h-100"></div>
				</div>
			</div>
		</div>
	</div>

</body>
<script>
	document.getElementById("loginButton").addEventListener("click", async () => {
		const email = document.getElementById("signin-email").value; // Corrected the ID
		const password = document.getElementById("signin-password").value; // Corrected the ID

		try {
			const response = await fetch("http://localhost:4000/login", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify({ email, password }),
			});

			if (response.ok) {
				// Redirect to dashboard if login is successful
				window.location.href = "dashboard.html";
			} else {
				// Display error message from the server
				const error = await response.text();
				alert("Error: " + error);
			}
		} catch (err) {
			console.error("Error:", err);
			alert("Something went wrong!");
		}
	});
</script>

<script>
	const togglePassword = document.getElementById("toggle-password");
	const passwordInput = document.getElementById("signin-password");
	const passwordIcon = document.getElementById("password-icon");

	togglePassword.addEventListener("click", () => {
		// Toggle password visibility
		if (passwordInput.type === "password") {
			passwordInput.type = "text";
			$("#password-icon").removeClass("fa-eye").addClass("fa fa-eye");
		} else {
			passwordInput.type = "password";
			$("#password-icon").removeClass("fa-eye-slash").addClass("fa-eye");
		}
	});
</script>

</html>
